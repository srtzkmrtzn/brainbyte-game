<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="BrainByte: Coding Challenge web game prototype"
  />
  <title>BrainByte: Coding Challenge</title>

  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <section id="logoScreen">
  <div class="menu-preview-logo-screen" aria-label="Main scene preview">
    <div class="preview-grid-logo-screen"></div>
    <div class="logo-box-main" aria-label="BrainByte logo and title">
        <img src="/assets/brainbyte-logo.png" alt="BrainByte Logo">

          <input id="newUsername" type="text" maxlength="20" placeholder="ENTER USERNAME" style="margin-top: 30px; padding: 12px; width: 250px; background: #000; color: var(--green); border: 1px solid var(--green); text-align: center; font-family: monospace; text-transform: uppercase;">
  
          <button id="registerBtn" class="menu-btn primary" style="margin-top: 10px; width: 250px; justify-content: center;display: flex;">
          REGISTER & ENTER
          </button>
  
          <a href="main.html" style="color: var(--muted); font-size: 12px; margin-top: 15px; text-decoration: none; font-family: monospace;">
          CONTINUE EXISTING USER / CONTINUE AS GUEST
        </a>
    </div>
        
  </div>
  </section>

  

    <script src="../script.js"></script>
