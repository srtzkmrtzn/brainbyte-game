<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="BrainByte: Coding Challenge web game prototype"
  />
  <title>BrainByte: Coding Challenge</title>

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <section id="logoScreen">
  <div class="menu-preview-logo-screen" aria-label="Main scene preview">
    <div class="preview-grid-logo-screen"></div>
    <div class="logo-box-main" aria-label="BrainByte logo and title">
        <img src="/assets/brainbyte-logo.png" alt="BrainByte Logo">

          <input id="newUsername" type="text" maxlength="20" placeholder="ENTER USERNAME" style="margin-top: 30px; padding: 12px; width: 250px; background: #000; color: var(--green); border: 1px solid var(--green); text-align: center; font-family: monospace; text-transform: uppercase;">
  
          <button id="registerBtn" class="menu-btn primary" style="margin-top: 10px; width: 250px; justify-content: center;display: flex;">
          REGISTER & ENTER
          </button>
  
          <button id="loginBtn" class="menu-btn primary" type="button" style="margin-top: 15px; width: 250px; justify-content: center; display: flex; font-size: 14px;">
          LOG IN  
          </button>
    </div>
        
  </div>
  </section>

  <!-- =========================================================
  MODALS & TOAST (Required for Log In pop-up)
  ========================================================== -->
  <div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="modalTitle">Confirm Execute</h2>
      <p id="modalMessage"></p>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="wide-btn secondary" type="button">CANCEL</button>
        <button id="modalConfirm" class="wide-btn primary" type="button">CONFIRM</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../js/script.js"></script>
</body>
</html>
